[workspace]
resolver = "3"
members = ["crates/mk-core", "crates/mk-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
repository = "https://github.com/star132-bot/MKconnect"
publish = false

[workspace.dependencies]
mk-core = { path = "crates/mk-core" }
iroh = "1.3"
n0-future = "0.3"
tokio = { version = "1.44", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
data-encoding = "2.2"
blake3 = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
rustls-pki-types = { version = "1.9", features = ["std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
